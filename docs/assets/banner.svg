<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rittenregistratie-bot promotional banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F17"/>
      <stop offset="1" stop-color="#123524"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#25D366"/>
      <stop offset="1" stop-color="#128C7E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 62px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .sub   { font: 400 30px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #B7E4C7; }
      .pill  { font: 600 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #EAFBF0; }
      .foot  { font: 500 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7FD9A6; }
      .mono  { font: 500 22px 'SF Mono','Consolas',monospace; fill: #DFF6E7; }
      .bubtxt{ font: 500 24px 'Segoe UI', Arial, sans-serif; fill: #0B1F17; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle road dashes -->
  <g opacity="0.10" stroke="#25D366" stroke-width="6" stroke-dasharray="34 26" stroke-linecap="round">
    <path d="M-20 560 C 300 500, 500 620, 820 540 S 1180 520, 1240 560"/>
  </g>

  <!-- left content -->
  <g transform="translate(80,110)">
    <!-- badge -->
    <rect x="0" y="0" rx="22" ry="22" width="360" height="46" fill="#0E2A1E" stroke="#25D366" stroke-opacity="0.5"/>
    <circle cx="28" cy="23" r="8" fill="url(#accent)"/>
    <text class="pill" x="48" y="31">Open Source · MIT</text>

    <text class="title" x="0" y="140">rittenregistratie-bot</text>
    <text class="sub" x="0" y="192">Log your car trips over WhatsApp.</text>
    <text class="sub" x="0" y="232">Belastingdienst-compliant. Self-hosted.</text>

    <!-- feature ticks -->
    <g transform="translate(0,286)">
      <g>
        <circle cx="14" cy="0" r="14" fill="url(#accent)"/>
        <path d="M7 0 l5 5 l9 -11" stroke="#0B1F17" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="mono" x="42" y="7">Send "145230 Office" → row appended</text>
      </g>
      <g transform="translate(0,48)">
        <circle cx="14" cy="0" r="14" fill="url(#accent)"/>
        <path d="M7 0 l5 5 l9 -11" stroke="#0B1F17" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="mono" x="42" y="7">Auto private/business, ≤500 km rule</text>
      </g>
      <g transform="translate(0,96)">
        <circle cx="14" cy="0" r="14" fill="url(#accent)"/>
        <path d="M7 0 l5 5 l9 -11" stroke="#0B1F17" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="mono" x="42" y="7">Runs on a Raspberry Pi · Plugin system</text>
      </g>
    </g>

    <text class="foot" x="0" y="452">Python · FastAPI · Cloud API · Cloudflare Tunnel</text>
  </g>

  <!-- right phone mockup -->
  <g transform="translate(830,120)" filter="url(#shadow)">
    <rect x="0" y="0" rx="42" ry="42" width="290" height="410" fill="#0E2A1E" stroke="#1E4D38" stroke-width="2"/>
    <rect x="16" y="16" rx="30" ry="30" width="258" height="378" fill="#0B1F17"/>
    <!-- speaker -->
    <rect x="118" y="30" rx="4" ry="4" width="54" height="8" fill="#1E4D38"/>

    <!-- incoming bubble (user) -->
    <g transform="translate(40,70)">
      <rect x="0" y="0" rx="16" ry="16" width="210" height="52" fill="url(#accent)"/>
      <text class="bubtxt" x="18" y="33">145230 Office</text>
    </g>

    <!-- reply bubble (bot) -->
    <g transform="translate(36,150)">
      <rect x="0" y="0" rx="16" ry="16" width="214" height="150" fill="#14352455" stroke="#25D366" stroke-opacity="0.35"/>
      <text class="mono" x="16" y="34" style="font-size:18px; fill:#DFF6E7;">Logged ✅</text>
      <text class="mono" x="16" y="64" style="font-size:17px; fill:#B7E4C7;">Home → Office</text>
      <text class="mono" x="16" y="90" style="font-size:17px; fill:#B7E4C7;">40 km · business</text>
      <text class="mono" x="16" y="116" style="font-size:17px; fill:#B7E4C7;">Odo 145230</text>
    </g>

    <!-- ping/pong -->
    <g transform="translate(40,318)">
      <rect x="0" y="0" rx="14" ry="14" width="80" height="40" fill="url(#accent)"/>
      <text class="bubtxt" x="20" y="26" style="font-size:20px;">ping</text>
      <rect x="128" y="0" rx="14" ry="14" width="82" height="40" fill="#14352455" stroke="#25D366" stroke-opacity="0.35"/>
      <text x="150" y="26" style="font: 500 20px 'Segoe UI',Arial; fill:#DFF6E7;">pong</text>
    </g>
  </g>
</svg>
