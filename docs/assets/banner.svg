<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rittenregistratie-bot promotional banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E0C"/>
      <stop offset="0.55" stop-color="#0D1712"/>
      <stop offset="1" stop-color="#16281F"/>
    </linearGradient>
    <style>
      .kicker { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4ADE80; letter-spacing: 4px; }
      .title  { font: 700 72px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .sub    { font: 600 32px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #CFE3D8; }
      .bullet { font: 400 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E8F0EB; }
      .footl  { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FAE9E; }
      .footr  { font: 400 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7E8F87; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- kicker -->
  <text class="kicker" x="56" y="80">PYTHON · WHATSAPP BOT</text>

  <!-- decorative chat bubbles top-right -->
  <g transform="translate(950,44)" stroke="#4ADE80" stroke-width="2.5" fill="none" opacity="0.9">
    <rect x="0" y="0" rx="10" ry="10" width="110" height="38"/>
    <path d="M18 38 l0 12 l14 -12" stroke-linejoin="round"/>
    <rect x="66" y="52" rx="10" ry="10" width="128" height="38" stroke-opacity="0.55"/>
    <path d="M176 90 l0 12 l-14 -12" stroke-opacity="0.55" stroke-linejoin="round"/>
    <g stroke="none" fill="#4ADE80">
      <circle cx="24" cy="19" r="4"/>
      <circle cx="42" cy="19" r="4"/>
      <circle cx="60" cy="19" r="4"/>
    </g>
    <path d="M96 71 l10 10 l18 -20" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  </g>

  <!-- title -->
  <text class="title" x="52" y="165">rittenregistratie-bot</text>

  <!-- subtitle -->
  <text class="sub" x="56" y="225">Log your car trips over WhatsApp —</text>
  <text class="sub" x="56" y="268">Belastingdienst-compliant, self-hosted.</text>

  <!-- bullets -->
  <g fill="#4ADE80">
    <circle cx="66" cy="352" r="7"/>
    <circle cx="66" cy="406" r="7"/>
    <circle cx="66" cy="460" r="7"/>
  </g>
  <text class="bullet" x="92" y="361">Send "145230 Office" — an audit-ready row is appended</text>
  <text class="bullet" x="92" y="415">Per-year Excel per car · multi-car by sender's number</text>
  <text class="bullet" x="92" y="469">Runs on a Raspberry Pi · plugin system</text>

  <!-- footer -->
  <line x1="56" y1="540" x2="1144" y2="540" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <text class="footl" x="56" y="588">Trip logging only · not tax advice</text>
  <text class="footr" x="1144" y="588" text-anchor="end">MIT · self-hosted, your data stays yours</text>
</svg>
