name: Bug report
description: Report a problem with the bot
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste secrets** (tokens, app secrets,
        phone numbers) anywhere in this issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected.
      placeholder: When I send "145230 Office", the bot ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send message '...'
        2. See error in journal '...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main @ abc1234
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Raspberry Pi (Debian)
        - Linux (other)
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.x"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any tokens/numbers first.
      render: text
